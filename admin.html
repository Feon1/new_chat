<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админ-панель Феон (Telegram + Web)</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #e0e0e0;
            --text-secondary: #a0a0a0;
            --accent: #4caf50;
            --danger: #f44336;
            --border: #333;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        
        body { background-color: var(--bg-color); color: var(--text-primary); min-height: 100vh; display: flex; flex-direction: column; }

        header { 
            background: var(--card-bg); padding: 1rem 2rem; border-bottom: 1px solid var(--border); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        
        .stats { display: flex; gap: 1rem; }
        .stat-card { background: var(--bg-color); padding: 0.5rem 1rem; border-radius: 8px; text-align: center; min-width: 100px; }
        .stat-value { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
        .stat-label { font-size: 0.8rem; color: var(--text-secondary); }

        nav { display: flex; gap: 1rem; padding: 1rem 2rem; border-bottom: 1px solid var(--border); }
        nav button { 
            background: none; border: none; color: var(--text-secondary); cursor: pointer; 
            padding: 0.5rem 1rem; font-size: 1rem; border-bottom: 2px solid transparent; transition: all 0.3s;
        }
        nav button.active { color: var(--accent); border-bottom-color: var(--accent); }

        main { flex: 1; padding: 2rem; max-width: 1400px; margin: 0 auto; width: 100%; }
        
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* Chat History Styles */
        .chat-container { display: grid; grid-template-columns: 300px 1fr; gap: 2rem; height: calc(100vh - 200px); }
        .user-list { background: var(--card-bg); border-radius: 12px; overflow-y: auto; padding: 1rem; }
        .user-item { 
            padding: 1rem; margin-bottom: 0.5rem; border-radius: 8px; cursor: pointer; 
            transition: background 0.2s; border-left: 3px solid transparent;
        }
        .user-item:hover { background: rgba(255,255,255,0.05); }
        .user-item.active { background: rgba(76, 175, 80, 0.1); border-left-color: var(--accent); }
        .user-name { font-weight: bold; margin-bottom: 0.25rem; }
        .user-meta { font-size: 0.8rem; color: var(--text-secondary); }

        .messages-area { background: var(--card-bg); border-radius: 12px; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; }
        .message { max-width: 80%; padding: 1rem; border-radius: 12px; line-height: 1.5; position: relative; }
        .message.user { align-self: flex-end; background: var(--accent); color: #000; border-bottom-right-radius: 2px; }
        .message.bot { align-self: flex-start; background: rgba(255,255,255,0.1); border-bottom-left-radius: 2px; }
        .msg-time { font-size: 0.7rem; opacity: 0.7; margin-top: 0.5rem; text-align: right; }

        /* Knowledge Base Styles */
        .kb-controls { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; }
        .kb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
        .kb-card { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); }
        .kb-text { font-size: 0.9rem; color: var(--text-secondary); margin: 1rem 0; max-height: 150px; overflow: hidden; text-overflow: ellipsis; white-space: pre-wrap; }
        
        /* Buttons & Inputs */
        button.btn { 
            padding: 0.6rem 1.2rem; border: none; border-radius: 6px; cursor: pointer; 
            font-weight: 500; transition: opacity 0.2s; 
        }
        button.btn:hover { opacity: 0.9; }
        button.btn-danger { background: var(--danger); color: white; }
        button.btn-primary { background: var(--accent); color: white; }
        
        input, textarea { 
            background: var(--bg-color); border: 1px solid var(--border); color: var(--text-primary); 
            padding: 0.8rem; border-radius: 6px; width: 100%; font-size: 1rem;
        }
        textarea { resize: vertical; min-height: 100px; }

        .loading { text-align: center; padding: 2rem; color: var(--text-secondary); }
        .empty-state { text-align: center; padding: 3rem; color: var(--text-secondary); }

        @media (max-width: 768px) {
            .chat-container { grid-template-columns: 1fr; }
            .user-list { max-height: 200px; }
            .stats { flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <header>
        <h2>🔒 Админ-панель Феон (TG + Web)</h2>
        <div class="stats">
            <div class="stat-card"><div class="stat-value" id="stat-users">0</div><div class="stat-label">Пользователей</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-messages">0</div><div class="stat-label">Сообщений</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-knowledge">0</div><div class="stat-label">Фрагментов знаний</div></div>
        </div>
        <button class="btn btn-danger" onclick="logout()">Выйти</button>
    </header>

    <nav>
        <button class="active" onclick="switchTab('history')">💬 История чатов</button>
        <button onclick="switchTab('knowledge')">📚 База знаний</button>
    </nav>

    <main>
        <!-- Tab: Chat History -->
        <div id="tab-history" class="tab-content active">
            <div class="chat-container">
                <div class="user-list" id="user-list">
                    <div class="loading">Загрузка пользователей...</div>
                </div>
                <div class="messages-area" id="messages-area">
                    <div class="empty-state">Выберите пользователя для просмотра истории</div>
                </div>
            </div>
        </div>

        <!-- Tab: Knowledge Base -->
        <div id="tab-knowledge" class="tab-content">
            <div class="kb-controls">
                <input type="text" id="new-knowledge-text" placeholder="Добавить новое знание (мин. 10 символов)...">
                <button class="btn btn-primary" onclick="addKnowledge()">➕ Добавить</button>
                <input type="file" id="file-upload" accept=".pdf,.docx" style="display:none" onchange="uploadFile(this)">
                <button class="btn btn-primary" onclick="document.getElementById('file-upload').click()">📁 Загрузить файл</button>
            </div>
            <div class="kb-grid" id="knowledge-grid">
                <div class="loading">Загрузка базы знаний...</div>
            </div>
        </div>
    </main>

    <script>
        // ⚠️ ЗАМЕНИТЕ НА ВАШ РЕАЛЬНЫЙ URL RENDER ПРИЛОЖЕНИЯ
        const API_BASE = "https://docker-new-chat.onrender.com"; 
// ⚠️ Замените docker-new-chat.onrender.com на ваш реальный URL Render
        
        let adminToken = localStorage.getItem('admin_token');
        if (!adminToken) {
            adminToken = prompt('Введите ADMIN_TOKEN:');
            if (adminToken) localStorage.setItem('admin_token', adminToken);
        }

        const headers = { 'x-admin-token': adminToken };

        async function apiCall(endpoint, options = {}) {
            try {
                const res = await fetch(`${API_BASE}${endpoint}`, { 
                    headers: { ...headers, 'Content-Type': 'application/json' }, 
                    ...options 
                });
                if (res.status === 401) {
                    localStorage.removeItem('admin_token');
                    alert('Неверный токен!');
                    location.reload();
                    return null;
                }
                return await res.json();
            } catch (e) {
                console.error('API Error:', e);
                return null;
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(el => el.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            event.target.classList.add('active');
            
            if (tab === 'history') loadUsers();
            if (tab === 'knowledge') loadKnowledge();
        }

        async function loadStats() {
            const usersData = await apiCall('/get_all_users');
            const kbData = await apiCall('/get_all_knowledge');
            
            if (usersData) {
                document.getElementById('stat-users').textContent = usersData.total || 0;
                document.getElementById('stat-messages').textContent = usersData.users?.reduce((sum, u) => sum + u.message_count, 0) || 0;
            }
            if (kbData) document.getElementById('stat-knowledge').textContent = kbData.total || 0;
        }

        async function loadUsers() {
            const data = await apiCall('/get_all_users');
            const list = document.getElementById('user-list');
            
            if (!data || !data.users.length) {
                list.innerHTML = '<div class="empty-state">Нет пользователей</div>';
                return;
            }

            list.innerHTML = data.users.map(u => `
                <div class="user-item" onclick="loadHistory('${u.user_id}', this)">
                    <div class="user-name">${u.user_id}</div>
                    <div class="user-meta">${u.message_count} сообщ. • ${new Date(u.last_activity).toLocaleString('ru-RU')}</div>
                </div>
            `).join('');
        }

        async function loadHistory(userId, element) {
            document.querySelectorAll('.user-item').forEach(el => el.classList.remove('active'));
            if (element) element.classList.add('active');

            const area = document.getElementById('messages-area');
            area.innerHTML = '<div class="loading">Загрузка истории...</div>';

            const data = await apiCall(`/get_history?user_id=${userId}`);
            if (!data || !data.history.length) {
                area.innerHTML = '<div class="empty-state">История пуста</div>';
                return;
            }

            area.innerHTML = data.history.map(m => `
                <div class="message ${m.role}">
                    ${m.content.replace(/\n/g, '<br>')}
                    <div class="msg-time">${new Date(m.timestamp).toLocaleString('ru-RU')}</div>
                </div>
            `).join('');
            
            area.scrollTop = area.scrollHeight;
        }

        async function deleteUser(userId) {
            if (!confirm(`Удалить пользователя ${userId}?`)) return;
            await apiCall(`/delete_user?user_id=${userId}`, { method: 'DELETE' });
            loadUsers();
            loadStats();
        }

        async function addKnowledge() {
            const input = document.getElementById('new-knowledge-text');
            const text = input.value.trim();
            if (text.length < 10) return alert('Минимум 10 символов');

            const res = await apiCall('/add_knowledge', { 
                method: 'POST', 
                body: JSON.stringify({ text }) 
            });
            
            if (res?.status === 'success') {
                input.value = '';
                loadKnowledge();
                loadStats();
            } else {
                alert(res?.error || 'Ошибка добавления');
            }
        }

        async function uploadFile(input) {
            const file = input.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            const res = await fetch(`${API_BASE}/upload_document`, {
                method: 'POST',
                headers: { 'x-admin-token': adminToken },
                body: formData
            });

            const data = await res.json();
            if (data.status === 'success') {
                alert(data.message);
                loadKnowledge();
                loadStats();
            } else {
                alert(data.error || 'Ошибка загрузки');
            }
            input.value = '';
        }

        async function loadKnowledge() {
            const data = await apiCall('/get_all_knowledge');
            const grid = document.getElementById('knowledge-grid');
            
            if (!data || !data.knowledge.length) {
                grid.innerHTML = '<div class="empty-state">База знаний пуста</div>';
                return;
            }

            grid.innerHTML = data.knowledge.map(k => `
                <div class="kb-card">
                    <strong>${k.source_file}</strong>
                    <div class="kb-text">${k.text}</div>
                    <small>Длина: ${k.length} симв. | ID: ${k.id.toString().slice(0,8)}...</small>
                    <br><br>
                    <button class="btn btn-danger" onclick="deleteKnowledge('${k.id}')">🗑️ Удалить</button>
                </div>
            `).join('');
        }

        async function deleteKnowledge(id) {
            if (!confirm('Удалить этот фрагмент знания?')) return;
            await apiCall('/delete_knowledge', { 
                method: 'DELETE', 
                body: JSON.stringify({ id }) 
            });
            loadKnowledge();
            loadStats();
        }

        function logout() {
            localStorage.removeItem('admin_token');
            location.reload();
        }

        // Init
        loadStats();
        loadUsers();
    </script>
</body>
</html>
